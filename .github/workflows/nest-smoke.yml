name: Nest CLI Smoke (Cross-OS)

on:
  pull_request:
    paths:
      - "apps/cli/**"
      - ".github/workflows/nest-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    name: "${{ matrix.os }} / Node ${{ matrix.node_version }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node_version: 22
          - os: macos-latest
            node_version: 22
          # Keep Windows on Node 20 for better native module/node-gyp stability.
          - os: windows-2022
            node_version: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Nest CLI tests
        run: npm run --workspace @nest/cli test

      - name: Build self-contained Nest CLI executable
        run: npm run --workspace @nest/cli build:release

      - name: Smoke test binary (full command surface)
        run: node apps/cli/scripts/ci-smoke.mjs
